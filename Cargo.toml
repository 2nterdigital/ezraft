[package]
name          = "ezraft"
version       = "0.2.2"
edition       = "2024"
authors       = ["Zhang Yanpo <drdr.xp@gmail.com>"]
categories    = ["algorithms", "asynchronous", "data-structures"]
description   = "A beginner-friendly Raft framework built on openraft"
documentation = "https://docs.rs/ezraft"
homepage      = "https://github.com/drmingdrmer/ezraft"
keywords      = ["raft", "consensus"]
license       = "MIT OR Apache-2.0"
readme        = "README.md"
repository    = "https://github.com/drmingdrmer/ezraft"

# This is the 2nterdigital fork (see FORK.md). It keeps the crate name so the code reads like the
# original, which is exactly why it must never reach crates.io: consumers take it as a git
# dependency pinned to a full commit SHA on `dev`.
publish = false

# Each example keeps its end-to-end test beside it, as `<example>_test.rs`, and
# the two tests share `harness.rs`. Auto-discovery would take all three for
# examples and fail to build them, so every example is declared below instead.
autoexamples = false

[dependencies]
# Pinned exactly: openraft is a pre-release series that breaks API between
# alphas, and this crate implements its storage, network and type-config
# traits. A caret requirement would let a downstream `cargo update` pull an
# incompatible alpha into a build of ezraft that never changed.
openraft = { version = "=0.10.0-alpha.33", features = ["serde", "type-alias"] }

# No default features: one of them is `http2`, which pulls in h2 0.3 through
# actix-http 3.x (still on `http` 0.2). h2 patched RUSTSEC-2026-0258 only in
# 0.4.16, so that path fails `cargo audit`. Raft traffic here is HTTP/1.1 over
# plain `http://`, and this crate uses none of the other default features, so
# dropping the whole set costs nothing.
actix-web   = { version = "4.0", default-features = false }
async-trait = { version = "0.1" }
# Values travel as base64 text in human-readable formats (JSON on the wire and in the log store)
# and as raw bytes in binary ones (postcard snapshots). No SIMD feature: values are at most
# 64 KiB, so portable safe code costs nothing measurable.
base64      = { version = "0.23.1", default-features = false, features = ["std"] }
# KV values are opaque bytes; `Bytes` makes handing one value to a view, a change group and a
# response a reference count instead of a copy.
bytes       = { version = "1.12.1" }
derive_more = { version = "2.1.1", features = ["display"] }
futures     = { version = "0.3" }
# The KV state machine is an immutable persistent ordered map: taking a view clones the root,
# O(1), and readers never block `apply`. `serde` gives the idempotency ledger's `OrdMap` fields
# (ech0-media#30) plain Serialize/Deserialize impls that postcard can round-trip, the same
# discipline every other type inside the snapshot's `InternalState` block follows.
imbl        = { version = "7.0.2", features = ["serde"] }
# The snapshot codec (ech0-media#28): a compact positional binary format with no
# `deserialize_any`, so every KV vocabulary type round-trips through it unmodified (see
# `src/kv/bytes_codec.rs`). `alloc` is all `to_allocvec`/`from_bytes` need; no `derive` feature,
# since every encoded type already derives `Serialize`/`Deserialize` through plain `serde`.
postcard    = { version = "1.1.3", default-features = false, features = ["alloc"] }
# The production `EzStorage`: one database, three tables (log, meta, snapshot), one
# `Durability::Immediate` write transaction per `persist`. 4.3.0 or newer, per the storage decision
# recorded in FORK.md; only the default `std` feature is needed.
redb        = { version = "4.3.0" }
reqwest     = { version = "0.12", features = ["json"] }
serde       = { version = "1.0.114", features = ["derive"] }
serde_json  = { version = "1.0.57" }
# Constant-time comparison of the presented `Authorization: Bearer` credential against the
# cluster token (ech0-media#29): an audited primitive instead of `==`, so a byte-by-byte timing
# difference can never leak how much of the token an attacker already guessed.
subtle      = { version = "2.6" }
thiserror   = { version = "2.0.20" }
tokio       = { version = "1.39", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
# Structured logging on key paths (snapshot build/send/install, rejected cluster tokens, and
# the elections, write forwarding and watch resets still to come). Libraries never install a
# subscriber.
tracing     = { version = "0.1" }
# `RequestId` (ech0-media#30): a ULID is a fixed-width, plain-serde-friendly idempotency key with
# no coordination needed to generate one on whichever node a write is called on.
ulid        = { version = "3.0.0", features = ["serde"] }

[features]
# Test-only network fault injection (ech0-media#23): drop, delay, or hide the response of
# requests between chosen directed node pairs, and heal them again. Off by default, so a normal
# build has none of the hook's types, fields, or branches - see `src/transport/fault.rs`. The
# self dev-dependency below turns it on for every `cargo test` binary without any `--features`.
fault-injection = []

[dev-dependencies]
clap               = { version = "4.1.11", features = ["derive", "env"] }
ezraft             = { path = ".", features = ["fault-injection"] }
# One redb file per node under its own temp directory, for the in-process cluster tests
# (`tests/common/`) and `RedbStorage`'s own unit tests.
tempfile           = { version = "3" }
tracing-subscriber = { version = "0.3.3", features = ["env-filter"] }

[[example]]
name = "kvstore"
path = "examples/kvstore.rs"

[[test]]
name = "kvstore_example"
path = "examples/kvstore_test.rs"

[profile.release]
debug = 2
split-debuginfo = "packed"
